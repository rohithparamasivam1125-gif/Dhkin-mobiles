name: dhkin_mobiles
description: "A new Flutter project for DHKIN Mobiles."
publish_to: 'none'

version: 1.0.3+30

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.19.0
  onesignal_flutter: ^5.4.6
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  local_auth: ^3.0.2
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
